<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>谁是卧底 · 开发测试区</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="谁是卧底测试版：单机热座与房间码联机，词牌只发给本人。">
<style>
  :root { color-scheme: dark;
    --bg:#0c1119; --card:#151d2c; --card2:#1b2536; --line:#283749; --fg:#e8f0ff;
    --muted:#93a4bd; --accent:#63b3ff; --bad:#ff7b8a; --good:#3ddc97; --gold:#ffd27a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; padding:18px 14px 40px;
    background:radial-gradient(900px 480px at 50% -10%,#152238 0%,var(--bg) 62%);
    color:var(--fg); font:15.5px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { width:min(720px,100%); margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
    margin-bottom:12px; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  h1 { font-size:20px; margin:0 0 4px; }
  h3 { font-size:13px; color:var(--accent); margin:0 0 8px; letter-spacing:.04em; }
  .sub { color:var(--muted); font-size:12.5px; margin:0 0 10px; }
  button { font:inherit; cursor:pointer; border-radius:11px; border:1px solid transparent; background:#1f2a3d;
    color:var(--fg); padding:9px 15px; transition:transform .07s, filter .12s; }
  button:active { transform:translateY(1px); } button:disabled { opacity:.42; cursor:not-allowed; }
  button.primary { background:linear-gradient(180deg,#3f8fd6,#2568a8); color:#fff; font-weight:650; }
  button.ghost { background:transparent; border-color:var(--line); color:var(--muted); }
  input[type=text], input[type=number] { font:inherit; color:var(--fg); background:#0e1622;
    border:1px solid var(--line); border-radius:10px; padding:8px 11px; min-width:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; }
  .pl { display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--line);
    border-radius:11px; padding:8px 10px; font-size:13.5px; }
  .pl .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl.dead { opacity:.42; text-decoration:line-through; } .pl.me { border-color:var(--accent); }
  .msg { color:var(--muted); font-size:12.5px; line-height:1.8; }
  .word { font-size:30px; font-weight:800; letter-spacing:.08em; margin:8px 0; }
  .word.under { color:var(--bad); } .word.civ { color:var(--good); }
  .log { font-size:12.5px; color:var(--muted); max-height:180px; overflow:auto; line-height:1.85; }
  .log b { color:var(--fg); }
  .chat { max-height:170px; overflow:auto; display:flex; flex-direction:column; gap:5px; margin-bottom:8px; }
  .chat div { font-size:13px; } .chat .sys { color:var(--muted); font-size:12px; }
  .chat .who { color:var(--accent); margin-right:5px; }
  .cens { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:900; padding:24px; text-align:center; }
  .cens p { color:var(--muted); max-width:420px; margin:0; font-size:14px; line-height:1.8; }
  .sep { height:1px; background:var(--line); margin:12px 0; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px;
    background:#0e1a2a; border:1px solid var(--line); color:var(--muted); }
  .pill.on { color:var(--good); border-color:#1f4a35; }
  .hide { display:none !important; }
  .warn { background:#2b2413; border:1px solid #4a3d18; color:var(--gold); border-radius:12px;
    padding:10px 13px; font-size:12.5px; line-height:1.75; margin-top:10px; }
  #flash { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#22304a; border:1px solid var(--line); color:#fff; padding:10px 16px; border-radius:11px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:.22s; z-index:950; max-width:86vw; }
  #flash.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="flash"></div>
<script src="../_room.js"></script>
<script>
(function () {
  "use strict";

  const PAIRS = [
    ["苹果", "梨"], ["可乐", "雪碧"], ["北京", "上海"], ["面条", "米粉"], ["火锅", "烧烤"],
    ["咖啡", "奶茶"], ["自行车", "电动车"], ["筷子", "勺子"], ["篮球", "排球"], ["猫", "狗"],
    ["太阳", "月亮"], ["老师", "医生"], ["雨伞", "雨衣"], ["手机", "平板"], ["西瓜", "哈密瓜"],
    ["电影院", "剧院"], ["雪糕", "冰棍"], ["飞机", "高铁"], ["戒指", "项链"], ["毛笔", "钢笔"]
  ];
  const clone = o => JSON.parse(JSON.stringify(o));
  const aliveSeats = st => st.players.filter(p => p.alive).map(p => p.seat);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

  /* ================= 纯游戏逻辑 ================= */
  function initGame(players) {
    const n = players.length;
    const under = n >= 7 ? 2 : 1;                     // 7 人及以上两名卧底
    const pair = PAIRS[Math.floor(Math.random() * PAIRS.length)];
    const words = shuffle([pair[0], pair[1]]);
    const roles = shuffle(Array.from({ length: n }, (_, i) => i < under ? "under" : "civ"));
    return {
      phase: "reveal", round: 1, under, pairIndex: PAIRS.indexOf(pair),
      civilians_word: words[0], undercover_word: words[1],
      players: players.map((p, i) => ({ name: String(p.name || "玩家").slice(0, 10), role: roles[i], alive: true, seat: i, desc: "" })),
      descDone: {},
      stage: "desc", descOrder: shuffle(players.map((_, i) => i)),
      votes: {}, winner: null, reason: "", logs: ["词已分发，请按顺序描述自己的词（不要直接说出来）。"]
    };
  }
  function checkWin(st) {
    const u = st.players.filter(p => p.alive && p.role === "under").length;
    const c = st.players.filter(p => p.alive && p.role === "civ").length;
    if (u === 0) { st.winner = "civ"; st.reason = "所有卧底出局，平民获胜。"; return true; }
    if (u >= c) { st.winner = "under"; st.reason = "卧底人数不少于平民，卧底获胜。"; return true; }
    return false;
  }

  function act(st, msg) {
    const type = msg.type, data = msg.data || {}, seat = msg.seat;
    if (type === "advance" && !st.winner) {
      const ns = clone(st);
      if (ns.phase === "reveal") { ns.phase = "play"; ns.logs.push("开始描述与讨论。"); return { ok: true, state: ns }; }
      if (ns.phase === "play") {
        const waiting = ns.players.filter(p => p.alive && !ns.descDone[p.seat]);
        if (waiting.length) return { ok: false };
        ns.phase = "vote"; ns.votes = {}; ns.logs.push("进入投票。"); return { ok: true, state: ns };
      }
      return { ok: false };
    }
    const me = st.players[seat];
    if (!me || !me.alive || st.winner) return { ok: false };
    const ns = clone(st);

    if (type === "desc" && ns.phase === "play") {
      const txt = String(data.text || "").trim().slice(0, 30);
      if (!txt) return { ok: false };
      if (ns.descDone[seat]) return { ok: false };
      ns.players[seat].desc = txt;
      ns.descDone[seat] = true;
      ns.logs.push("「" + me.name + "」：" + txt);
      if (ns.players.filter(p => p.alive).every(p => ns.descDone[p.seat])) ns.logs.push("本轮描述完毕，主持人可开关投票。");
      return { ok: true, state: ns };
    }
    if ((type === "vote" && (ns.phase === "vote" || ns.phase === "vote2")) || false) {
      const t = data.target;
      if (t !== null && (!ns.players[t] || !ns.players[t].alive || t === seat)) return { ok: false };
      if (ns.votes[seat] !== undefined) return { ok: false };
      ns.votes[seat] = t;
      if (aliveSeats(ns).every(s => ns.votes[s] !== undefined)) {
        const tally = {};
        Object.values(ns.votes).forEach(x => { if (x !== null) tally[x] = (tally[x] || 0) + 1; });
        const arr = Object.entries(tally).map(([k, v]) => [Number(k), v]).sort((a, b) => b[1] - a[1]);
        let out = null;
        if (arr.length && (arr.length === 1 || arr[0][1] > arr[1][1])) out = arr[0][0];
        const newRound = s => { s.phase = "play"; s.votes = {}; s.descDone = {}; s.players.forEach(p => p.desc = ""); s.round += 1; };
        if (out === null) {
          if (ns.phase === "vote") { ns.logs.push("平票，进行第二轮投票。"); ns.phase = "vote2"; ns.votes = {}; }
          else { ns.logs.push("再次平票，本轮无人出局。"); newRound(ns); }
        } else {
          ns.players[out].alive = false;
          ns.logs.push("「" + ns.players[out].name + "」出局，身份是 <b>" + (ns.players[out].role === "under" ? "卧底" : "平民") + "</b>。");
          if (!checkWin(ns)) newRound(ns);
        }
      }
      return { ok: true, state: ns };
    }
    return { ok: false };
  }

  function pubView(st) {
    if (!st) return { phase: "lobby", round: 0, players: [], logs: [] };
    return {
      phase: st.phase, round: st.round, winner: st.winner, reason: st.reason, under: st.under,
      players: st.players.map(p => ({ name: p.name, alive: p.alive, seat: p.seat,
        roleName: st.winner ? (p.role === "under" ? "卧底" : "平民") : undefined })),
      words: st.winner ? { civ: st.civilians_word, under: st.undercover_word } : null,
      logs: st.logs.slice(-24)
    };
  }
  function over(st) { return st && st.winner ? { winner: st.winner, reason: st.reason } : null; }

  function privFor(st, seat) {
    const p = st && st.players && st.players[seat];
    if (!p) return null;
    const v = { seat, name: p.name, alive: p.alive, phase: st.phase, role: null, word: null,
                canAct: false, prompt: "", targets: [], info: "" };
    if (st.phase === "reveal") { v.word = p.role === "under" ? st.undercover_word : st.civilians_word; v.role = p.role; return v; }
    if (!p.alive || st.winner) return v;
    if (st.phase === "play") {
      v.role = p.role; v.word = p.role === "under" ? st.undercover_word : st.civilians_word;
      v.canAct = !st.descDone[seat];
      v.prompt = v.canAct ? "用一句话描述你的词（别直接说出词本身）" : "你本轮已描述，等人齐或等主持人开投票";
      v.info = st.descDone[seat] ? "你本轮描述：" + p.desc : "";
    } else if (st.phase === "vote" || st.phase === "vote2") {
      v.canAct = st.votes[seat] === undefined;
      v.prompt = st.phase === "vote2" ? "平票重投：选出你怀疑的人" : "投票选出卧底";
      v.targets = aliveSeats(st).filter(s => s !== seat);
    }
    return v;
  }

  const ADAPTER = { initGame, act, pubView, privView: (st, seat) => privFor(st, seat), over };

  /* ================= 联机 ================= */
  const room = RoomNet.create({
    ns: "dev/undercover/v1/", minPlayers: 4, maxPlayers: 12, adapter: ADAPTER, maxLen: 10,
    flash: m => flash(m)
  });

  /* ================= 界面 ================= */
  const ui = { mode: "menu", name: "" };
  const hot = { st: null, stage: "reveal", ri: 0, cens: true };
  const root = document.getElementById("root");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function flash(m) { const el = document.getElementById("flash"); if (!el) return; el.textContent = m; el.classList.add("show"); clearTimeout(flash._t); flash._t = setTimeout(() => el.classList.remove("show"), 2400); }
  const linkFor = code => location.origin + location.pathname + "#r=" + code;
  const phaseName = p => ({ reveal: "发词", play: "描述讨论", vote: "投票", vote2: "平票重投", end: "结束" })[p] || p;

  function grid(st, mySeat, showRole) {
    return `<div class="grid">` + st.players.map(p => `<div class="pl ${p.alive ? "" : "dead"} ${p.seat === mySeat ? "me" : ""}">
      <span class="nm">${p.seat + 1}. ${esc(p.name)}</span>
      ${showRole ? `<span class="pill">${p.role === "under" ? "卧底" : "平民"}</span>` : ""}
      ${p.alive && p.desc && st.phase !== "end" ? `<span class="pill">已描述</span>` : ""}</div>`).join("") + `</div>`;
  }
  function gridPub(players, mySeat) {
    return `<div class="grid">` + players.map(p => `<div class="pl ${p.alive ? "" : "dead"} ${p.seat === mySeat ? "me" : ""}">
      <span class="nm">${p.seat + 1}. ${esc(p.name)}</span></div>`).join("") + `</div>`;
  }

  /* ---------- 菜单 ---------- */
  function renderMenu() {
    root.innerHTML = `
      <div class="card">
        <h1>谁是卧底</h1>
        <p class="sub">测试版 · 自动主持 · 4–12 人 · 7 人起两名卧底</p>
        <div class="warn">平民拿到同一个词，卧底拿到相近的另一个词。轮流描述，然后投票找卧底。</div>
      </div>
      <div class="card">
        <h3>单机热座</h3>
        <div class="row" style="margin-top:8px">
          <input type="number" id="hn" value="6" min="4" max="12" style="width:88px"><span class="msg">人</span>
          <button class="primary" id="bhot">开始本地局</button>
        </div>
      </div>
      <div class="card">
        <h3>联机房间</h3>
        <div class="row"><input type="text" id="nm" placeholder="你的昵称" maxlength="10" style="flex:1"></div>
        <div class="row" style="margin-top:9px">
          <button class="primary" id="bcreate">建房</button>
          <input type="text" id="rc" placeholder="房号" maxlength="4" style="width:96px;text-transform:uppercase">
          <button id="bjoin">加入</button>
        </div>
      </div>`;
    document.getElementById("bhot").onclick = () => {
      const n = Math.max(4, Math.min(12, parseInt(document.getElementById("hn").value, 10) || 6));
      hot.st = initGame(Array.from({ length: n }, (_, i) => ({ name: (i + 1) + "号" })));
      hot.stage = "reveal"; hot.ri = 0; hot.cens = true; ui.mode = "hot"; render();
    };
    document.getElementById("bcreate").onclick = () => {
      ui.name = (document.getElementById("nm").value || "").trim() || "房主";
      ui.mode = "online"; room.start("host", room.newRoom(), ui.name); render();
    };
    document.getElementById("bjoin").onclick = () => {
      ui.name = (document.getElementById("nm").value || "").trim() || "玩家";
      const rc = (document.getElementById("rc").value || "").trim().toUpperCase();
      if (rc.length < 3) { flash("房号不对"); return; }
      ui.mode = "online"; room.start("guest", rc, ui.name); render();
    };
  }

  /* ---------- 热座：发词 ---------- */
  function renderReveal() {
    const st = hot.st, i = hot.ri, p = st.players[i];
    const isLast = i + 1 >= st.players.length;
    if (hot.cens) {
      root.innerHTML = `<div class="cens"><h2>请把设备交给 ${esc(p.name)}</h2>
        <p>其他人请回避 · 第 ${i + 1} / ${st.players.length} 位</p>
        <button class="primary" id="ok">我是 ${esc(p.name)}，看我的词</button></div>`;
      document.getElementById("ok").onclick = () => { hot.cens = false; render(); };
      return;
    }
    root.innerHTML = `<div class="card"><h3>你拿到的词</h3>
      <div class="word ${p.role === "under" ? "under" : "civ"}">${esc(p.role === "under" ? st.undercover_word : st.civilians_word)}</div>
      <p class="msg">记住它，然后传阅给下一位。别让别人看到。</p>
      <div class="row" style="margin-top:12px"><button class="primary" id="nx">${isLast ? "开始描述" : "记住了，下一位"}</button></div></div>`;
    document.getElementById("nx").onclick = () => {
      if (!isLast) { hot.ri = i + 1; hot.cens = true; }
      else { hot.stage = "play"; hot.cens = true; doAct(hot.st, { type: "advance", data: {}, seat: 0 }); return; }
      render();
    };
  }

  function pending(st) {
    return st.players.filter(p => p.alive && privFor(st, p.seat).canAct).map(p => p.seat);
  }

  function hotPlay() {
    const st = hot.st;
    if (st.winner) { hot.stage = "end"; return render(); }
    const pend = pending(st);
    if (pend.length === 0) return hotPublic(st);
    const seat = pend[0], p = st.players[seat], v = privFor(st, seat);
    if (hot.cens) {
      root.innerHTML = `<div class="cens"><h2>请把设备交给「${esc(p.name)}」</h2>
        <p>${phaseName(st.phase)} · 还剩 ${pend.length} 人</p><button class="primary" id="ok">是我</button></div>`;
      document.getElementById("ok").onclick = () => { hot.cens = false; render(); };
      return;
    }
    let body = "";
    if (v.phase === "play") {
      body = `<p class="msg">你的词是 <b>${esc(v.word)}</b>。${v.prompt}。</p>
        <div class="row"><input type="text" id="ds" maxlength="30" placeholder="一句话描述…" style="flex:1">
        <button class="primary" id="dsb">提交</button></div>`;
    } else {
      body = `<p class="msg">${v.prompt}（也可弃票）。</p>
        <div class="grid" id="tg">${v.targets.map(s => `<button data-s="${s}">${s + 1}. ${esc(st.players[s].name)}</button>`).join("")}</div>
        <div class="row" style="margin-top:9px"><button class="ghost" id="abs">弃票</button></div>`;
    }
    root.innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between"><span class="pill">第 ${st.round} 轮</span><span class="pill">${phaseName(v.phase)}</span></div>
      <h3 style="margin-top:12px">${esc(p.name)}</h3>${body}
      <div class="sep"></div><h3>局面</h3>${grid(st, seat, false)}
      <div class="sep"></div><div class="log">${st.logs.slice(-8).join("<br>")}</div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="cv">收起</button></div></div>`;
    document.getElementById("cv").onclick = () => { hot.cens = true; render(); };
    if (v.phase === "play") {
      document.getElementById("dsb").onclick = () => {
        const t = document.getElementById("ds").value;
        doAct(st, { type: "desc", data: { text: t }, seat });
      };
    } else {
      document.getElementById("tg").querySelectorAll("button").forEach(b => b.onclick = () => doAct(st, { type: "vote", data: { target: Number(b.dataset.s) }, seat }));
      document.getElementById("abs").onclick = () => doAct(st, { type: "vote", data: { target: null }, seat });
    }
  }

  function hotPublic(st) {
    root.innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between"><span class="pill">第 ${st.round} 轮</span><span class="pill">${phaseName(st.phase)}</span></div>
      <h3 style="margin-top:12px">局面</h3>${grid(st, -1, false)}
      <div class="sep"></div><div class="log">${st.logs.slice(-10).join("<br>")}</div>
      <div class="row" style="margin-top:12px">
        ${st.phase === "play" ? `<button class="primary" id="adv">进入投票</button>` : ""}
      </div></div>`;
    const adv = document.getElementById("adv");
    if (adv) adv.onclick = () => doAct(st, { type: "advance", data: {}, seat: 0 });
  }

  function doAct(st, msg) {
    const r = act(st, msg);
    if (!r.ok) { flash("这一步不合法"); return; }
    hot.st = r.state; hot.cens = true;
    if (hot.st.winner) hot.stage = "end";
    render();
  }

  function renderEnd(st, hotseat) {
    const w = st.winner;
    root.innerHTML = `<div class="card">
      <h1 class="word ${w === "under" ? "under" : "civ"}">${w === "under" ? "卧底获胜" : "平民获胜"}</h1>
      <p class="msg">${esc(st.reason)}<br>平民词：<b>${esc(st.civilians_word)}</b>　卧底词：<b>${esc(st.undercover_word)}</b></p>
      <div class="sep"></div><h3>全员身份</h3>${grid(st, -1, true)}
      <div class="sep"></div><div class="log">${st.logs.slice(-18).join("<br>")}</div>
      <div class="row" style="margin-top:14px">
        ${hotseat ? `<button class="primary" id="again">再来一局</button><button class="ghost" id="back">回菜单</button>`
                  : `<button class="ghost" id="back">离开房间</button>`}
      </div></div>`;
    if (hotseat) {
      document.getElementById("again").onclick = () => {
        hot.st = initGame(hot.st.players.map(p => ({ name: p.name })));
        hot.stage = "reveal"; hot.ri = 0; hot.cens = true; render();
      };
      document.getElementById("back").onclick = () => { ui.mode = "menu"; render(); };
    } else document.getElementById("back").onclick = () => { room.leave(); ui.mode = "menu"; render(); };
  }

  /* ---------- 联机 ---------- */
  function renderOnline() {
    const NET = room.net, HOST = room.host, isHost = NET.role === "host";
    const seats = isHost ? (HOST.seats || []) : (NET.seats || []);
    const started = isHost ? HOST.started : !!(NET.pub && NET.pub.phase && NET.pub.phase !== "lobby");
    const ov = isHost ? (HOST.state ? over(HOST.state) : null) : NET.over;

    if (!started) {
      const code = NET.room || "-";
      root.innerHTML = `<div class="card">
        <h1>房间 ${esc(code)}</h1>
        <div class="row" style="margin:6px 0 8px">
          <span class="pill ${NET.connected ? "on" : ""}">${NET.connected ? "已连中继" : "连接中…"}</span>
          <span class="pill ${isHost ? "on" : ""}">${isHost ? "房主" : "玩家"}</span>
        </div>
        <div class="row"><input type="text" id="lnk" readonly value="${esc(linkFor(code))}" style="flex:1;font-size:12px">
          <button id="cp">复制</button></div>
        <div class="sep"></div>
        <h3>席位 ${seats.length} / 12（至少 4 人）</h3>
        <div class="grid">${seats.map((s, i) => `<div class="pl"><span class="nm">${i + 1}. ${esc(s.name)}</span></div>`).join("") || `<div class="msg">等待玩家加入…</div>`}</div>
        <div class="sep"></div>
        <div class="chat">${(NET.chat || []).map(c => c.sys ? `<div class="sys">${esc(c.text)}</div>` : `<div><span class="who">${esc(c.name)}</span>${esc(c.text)}</div>`).join("")}</div>
        <div class="row"><input type="text" id="ci" placeholder="发条消息…" maxlength="90" style="flex:1"><button id="cs">发送</button></div>
        <div class="row" style="margin-top:12px">
          ${isHost ? `<button class="primary" id="st" ${seats.length < 4 ? "disabled" : ""}>开始游戏</button>` : `<span class="msg">等房主开局…</span>`}
          <button class="ghost" id="lv">离开</button>
        </div></div>`;
      const cpEl = document.getElementById("cp"); if (cpEl) cpEl.onclick = () => room.copyLink(linkFor(code));
      const stEl = document.getElementById("st"); if (stEl) stEl.onclick = () => room.startGame();
      document.getElementById("cs").onclick = () => { room.sendChat(document.getElementById("ci").value); document.getElementById("ci").value = ""; };
      document.getElementById("lv").onclick = () => { room.leave(); ui.mode = "menu"; render(); };
      return;
    }
    if (ov) {
      if (isHost) return renderEnd(HOST.state, false);
      root.innerHTML = `<div class="card">
        <h1 class="word ${ov.winner === "under" ? "under" : "civ"}">${ov.winner === "under" ? "卧底获胜" : "平民获胜"}</h1>
        <p class="msg">${esc(ov.reason || "")}${(NET.pub && NET.pub.words) ? `<br>平民词：<b>${esc(NET.pub.words.civ)}</b>　卧底词：<b>${esc(NET.pub.words.under)}</b>` : ""}</p>
        <div class="sep"></div><h3>全员身份</h3><div class="grid">${((NET.pub && NET.pub.players) || []).map(p => `<div class="pl ${p.alive ? "" : "dead"}"><span class="nm">${p.seat + 1}. ${esc(p.name)}</span><span class="tag">${esc(p.roleName || "")}</span></div>`).join("")}</div>
        <div class="log">${((NET.pub && NET.pub.logs) || []).join("<br>")}</div>
        <div class="row" style="margin-top:12px"><button class="ghost" id="lv">离开房间</button></div></div>`;
      document.getElementById("lv").onclick = () => { room.leave(); ui.mode = "menu"; render(); };
      return;
    }

    const view = isHost ? pubView(HOST.state) : (NET.pub || {});
    const me = isHost ? privFor(HOST.state, room.mySeat()) : (NET.priv || null);
    const seat = me ? me.seat : -1;
    let body = "";
    if (me && me.phase === "reveal") {
      body = `<h3>我的词</h3><div class="word ${me.role === "under" ? "under" : "civ"}">${esc(me.word || "—")}</div>
        <p class="msg">记住它。等所有人看完，房主点「开始描述」。</p>`;
    } else if (me && me.canAct && me.phase === "play") {
      body = `<h3>轮到你描述</h3><p class="msg">你的词：<b>${esc(me.word)}</b></p>
        <div class="row"><input type="text" id="ds" maxlength="30" placeholder="一句话描述…" style="flex:1"><button class="primary" id="dsb">提交</button></div>`;
    } else if (me && me.canAct) {
      body = `<h3>投票</h3><div class="grid" id="tg">${me.targets.map(s => `<button data-s="${s}">${s + 1}. ${esc((view.players[s] || {}).name || s)}</button>`).join("")}</div>
        <div class="row" style="margin-top:8px"><button class="ghost" id="abs">弃票</button></div>`;
    } else if (me) {
      body = `<h3>我的词</h3><p class="msg">${esc(me.word || "—")}　${me.info ? "· " + esc(me.info) : ""}</p>`;
    }

    root.innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between">
        <span class="pill">第 ${view.round || 0} 轮</span><span class="pill">${phaseName(view.phase)}</span>
        <span class="pill ${NET.connected ? "on" : ""}">${NET.connected ? "在线" : "重连中"}</span>
      </div>
      ${body}
      <div class="sep"></div><h3>局面</h3>${gridPub(view.players || [], seat)}
      <div class="sep"></div><div class="log">${(view.logs || []).join("<br>")}</div>
      <div class="sep"></div>
      <div class="chat">${(NET.chat || []).map(c => c.sys ? `<div class="sys">${esc(c.text)}</div>` : `<div><span class="who">${esc(c.name)}</span>${esc(c.text)}</div>`).join("")}</div>
      <div class="row"><input type="text" id="ci" placeholder="发言…" maxlength="90" style="flex:1"><button id="cs">发送</button></div>
      <div class="row" style="margin-top:10px">
        ${isHost && (view.phase === "reveal" || view.phase === "play") ? `<button class="primary" id="adv">${view.phase === "reveal" ? "开始描述" : "进入投票"}</button>` : ""}
        <button class="ghost" id="lv">离开</button>
      </div></div>`;

    if (me && me.canAct && me.phase === "play") {
      document.getElementById("dsb").onclick = () => room.send("desc", { text: document.getElementById("ds").value });
    }
    if (me && me.canAct && (me.phase === "vote" || me.phase === "vote2")) {
      const g = document.getElementById("tg");
      if (g) g.querySelectorAll("button").forEach(b => b.onclick = () => room.send("vote", { target: Number(b.dataset.s) }));
      const ab = document.getElementById("abs"); if (ab) ab.onclick = () => room.send("vote", { target: null });
    }
    const adv = document.getElementById("adv"); if (adv) adv.onclick = () => room.send("advance", {});
    document.getElementById("cs").onclick = () => { room.sendChat(document.getElementById("ci").value); document.getElementById("ci").value = ""; };
    document.getElementById("lv").onclick = () => { room.leave(); ui.mode = "menu"; render(); };
  }

  /* ---------- 路由 ---------- */
  function render() {
    if (ui.mode === "online") return renderOnline();
    if (ui.mode === "hot" && hot.st) {
      if (hot.st.winner) return renderEnd(hot.st, true);
      if (hot.stage === "reveal") return renderReveal();
      return hotPlay();
    }
    renderMenu();
  }

  room.setRender(() => { if (ui.mode === "online") renderOnline(); });

  (function boot() {
    const m = (location.hash || "").match(/#r=([A-Z0-9]{3,6})/i);
    if (m) {
      ui.mode = "online";
      room.start("guest", m[1].toUpperCase(), "玩家" + Math.floor(Math.random() * 90 + 10));
      render(); return;
    }
    renderMenu();
  })();
})();
</script>
</body>
</html>
