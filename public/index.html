<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部署成功 · Render</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0b1220; color: #e6edf7; padding: 24px;
  }
  .card {
    width: min(680px, 100%); background: #111c30; border: 1px solid #1f2f4d;
    border-radius: 16px; padding: 32px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 24px; }
  .sub { color: #8ba3c7; font-size: 14px; margin: 0 0 26px; }
  .ok { display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
        color: #5ce1a0; background: rgba(92,225,160,.10); border: 1px solid rgba(92,225,160,.3);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5ce1a0; }
  dl { margin: 0; }
  dt { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #7d92b3; margin-top: 18px; }
  dd { margin: 4px 0 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
       font-size: 15px; color: #cfe0f5; word-break: break-all; }
  .hint { margin-top: 30px; padding-top: 20px; border-top: 1px solid #1f2f4d;
          font-size: 13.5px; color: #8ba3c7; }
  code { background: #0b1220; padding: 2px 6px; border-radius: 5px; font-size: 13px; color: #9fd0ff; }
</style>
</head>
<body>
<main class="card">
  <div class="ok"><span class="dot"></span><span id="mode">静态站已上线</span></div>
  <h1>部署成功</h1>
  <p class="sub">这个页面就是你的「永久域名」正在工作的证明。</p>

  <dl>
    <dt>当前域名</dt>
    <dd id="host">读取中…</dd>

    <dt>协议</dt>
    <dd id="proto">—</dd>

    <dt>访问时间</dt>
    <dd id="now">—</dd>
  </dl>

  <p class="hint">
    把 <code>public/index.html</code> 改成你自己的内容，<code>git push</code> 后 Render 会自动重新部署。<br>
    要接自己的域名：Render 控制台 → 该服务 → Settings → Custom Domains。
  </p>
</main>
<script>
  document.getElementById('host').textContent = location.host;
  document.getElementById('proto').textContent = location.protocol.replace(':', '') + '（HTTPS 证书由 Render 自动签发）';
  document.getElementById('now').textContent = new Date().toLocaleString('zh-CN');
</script>
</body>
</html>
